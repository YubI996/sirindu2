# Apache VirtualHost — Sirindu (Laravel 10)
# Debian 13 · PHP 8.4 mod_php · /var/www/sirindu

<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/sirindu/public

    <Directory /var/www/sirindu/public>
        # Wajib agar .htaccess Laravel (URL rewriting) berfungsi
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # PHP settings — sama dengan docker/php/local.ini
    php_value upload_max_filesize  40M
    php_value post_max_size        40M
    php_value memory_limit         512M
    php_value max_execution_time   600
    php_value max_input_time       600

    # Log
    ErrorLog  ${APACHE_LOG_DIR}/sirindu-error.log
    CustomLog ${APACHE_LOG_DIR}/sirindu-access.log combined
</VirtualHost>
